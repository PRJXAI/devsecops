name: distroless-images
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      tool:
        description: Independent tool release (all runs isolated releases)
        type: choice
        required: true
        default: all
        options: [all, syft, grype, gitleaks, cargo-audit, cargo-deny, k3d, kustomize, kubectl, docker]
      publish:
        description: Publish selected policy-approved tools to GHCR from main
        type: boolean
        default: false
      redistribution_reviewed:
        description: Confirm artifact-specific notices, corresponding source and provenance for the selected tools
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --bin devsecops -- audit-dependencies
      - name: Public dependency count/status summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-security-status
          path: .work/public-audit.json
          retention-days: 14
          if-no-files-found: error
  tools:
    needs: structure
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(inputs.tool != '' && inputs.tool != 'all' && format('["{0}"]', inputs.tool) || '["syft","grype","gitleaks","cargo-audit","cargo-deny","k3d","kustomize","kubectl","docker"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/tool.yml
    with:
      tool: ${{ matrix.tool }}
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      redistribution_reviewed: ${{ github.event_name == 'workflow_dispatch' && inputs.redistribution_reviewed }}
  gitleaks-candidate:
    needs: structure
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Validate experimental Gitleaks natively without release approval
        run: cargo test --locked --bin devsecops release::gitleaks_candidate::native_gitleaks_dependency_candidate -- --ignored --exact
      - name: Preserve experimental native inventory and status only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitleaks-native-candidate-${{ matrix.arch }}
          path: .work/gitleaks-native-candidate/
          retention-days: 14
          if-no-files-found: error
