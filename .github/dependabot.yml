version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /images/syft
      - /images/grype
      - /images/gitleaks
      - /images/cargo-audit
      - /images/cargo-deny
      - /images/kind
      - /images/kustomize
      - /images/kubectl
      - /images/docker
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
